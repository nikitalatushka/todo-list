name: Deploy via FTP

on:
  push:
    branches:
      - main 

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }} # action-validator: disable-line
          port: ${{ secrets.FTP_PORT}} # action-validator: disable-line
          username: ${{ secrets.FTP_USERNAME }} # action-validator: disable-line
          password: ${{ secrets.FTP_PASSWORD}} # action-validator: disable-line
          exclude: |
            **/.git*
            **/.github/**
