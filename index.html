<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>Todo List</title>
  </head>
  <body>
    <section>
      <h2>Todo List</h2>
      <div>
        <input
          type="text"
          class="input-field"
          id="todoInput"
          placeholder="Add a new todo"
        />
      </div>

      <ul class="scroll">
        <li id="todoList"></li>
      </ul>

      <div>
        <hr class="counter" />
        <div class="counter-container">
          <p><span>0</span> items total</p>
          <button id="deleteButton">Delete All</button>
        </div>
      </div>
      <button class="btn">Add</button>
    </section>

    <footer class="footer">
      <p class="made-by">Made By</p>
      <p class="author">Nikita Latushka - 2025</p>
    </footer>
  </body>
</html>
